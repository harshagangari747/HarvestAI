AWSTemplateFormatVersion: '2010-09-09'
Description: 'HarvestAI MVP - Secrets Manager API Keys'

# Deploy this stack FIRST before any other stack.
# After deploying, populate secrets using scripts/setup_secrets.sh

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ProjectName:
    Type: String
    Default: harvestai

  # ── Data Source Keys ────────────────────────────────────────────
  OpenETAPIKey:
    Type: String
    NoEcho: true
    Default: 'PLACEHOLDER'
    Description: >
      OpenET API key from https://openetdata.org/developers
      Required for evapotranspiration data.

  NRELAPIKey:
    Type: String
    NoEcho: true
    Default: 'PLACEHOLDER'
    Description: >
      NREL NSRDB API key from https://developer.nrel.gov/signup/
      Optional - used for high-quality solar radiation data.

  EarthdataUsername:
    Type: String
    NoEcho: true
    Default: 'PLACEHOLDER'
    Description: >
      NASA Earthdata username from https://urs.earthdata.nasa.gov/users/new
      Optional - used for Sentinel-1, SMAP, MODIS via ASF.

  EarthdataPassword:
    Type: String
    NoEcho: true
    Default: 'PLACEHOLDER'
    Description: >
      NASA Earthdata password.

  NASSAPIKey:
    Type: String
    NoEcho: true
    Default: 'PLACEHOLDER'
    Description: >
      USDA NASS QuickStats API key from https://quickstats.nass.usda.gov/api
      Optional - used for county-level corn yield benchmarks.

Resources:
  # Single consolidated secret — all keys in one JSON blob.
  # Lambda reads this once per invocation and caches in memory.
  HarvestAIAPIKeys:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/api-keys/${Environment}'
      Description: 'All third-party API keys for HarvestAI data ingestion'
      SecretString: !Sub |
        {
          "openet_api_key": "${OpenETAPIKey}",
          "nrel_api_key": "${NRELAPIKey}",
          "earthdata_username": "${EarthdataUsername}",
          "earthdata_password": "${EarthdataPassword}",
          "nass_api_key": "${NASSAPIKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # Resource policy — only Lambda execution role may read this secret.
  # (Tightened further after LambdaStack is deployed by passing its role ARN.)
  HarvestAIAPIKeysPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref HarvestAIAPIKeys
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyExternalAccess
            Effect: Deny
            Principal: '*'
            Action: 'secretsmanager:*'
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

Outputs:
  SecretsARN:
    Value: !Ref HarvestAIAPIKeys
    Description: >
      ARN of the Secrets Manager secret.
      Pass this as APIKeySecretsArn when deploying main.yaml.
    Export:
      Name: !Sub '${ProjectName}-api-keys-arn-${Environment}'

  SecretsName:
    Value: !Sub '${ProjectName}/api-keys/${Environment}'
    Description: Secret name (for use with AWS CLI)
    Export:
      Name: !Sub '${ProjectName}-api-keys-name-${Environment}'
