AWSTemplateFormatVersion: '2010-09-09'
Description: 'HarvestAI MVP - Lambda Functions & IAM Roles'

Parameters:
  Environment:
    Type: String
    Default: dev

  ProjectName:
    Type: String
    Default: harvestai

  FieldsTableName:
    Type: String

  ObservationsTableName:
    Type: String

  DailyStatusTableName:
    Type: String

  WeatherHistoryTableName:
    Type: String

  ETHistoryTableName:
    Type: String

  BatchLogTableName:
    Type: String

  APIKeySecretsArn:
    Type: String
    Description: ARN of Secrets Manager secret (harvestai/api-keys/{env})

Resources:
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # DynamoDB access
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FieldsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FieldsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservationsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservationsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DailyStatusTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DailyStatusTableName}/*'

        # DynamoDB — weather, ET, batch log tables
        - PolicyName: DynamoDBAccessExtended
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WeatherHistoryTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WeatherHistoryTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ETHistoryTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ETHistoryTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BatchLogTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BatchLogTableName}/*'

        # Secrets Manager access
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref APIKeySecretsArn

        # S3 access for satellite data & previews
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'

        # Bedrock access — Claude Haiku 4.5 only via US inference profile
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
                  # The US profile can route to US destination Regions; permit only this Haiku model.
                  - !Sub 'arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'

        # Allow field-onboarding to fire-and-forget invoke daily-batch for the
        # new-field satellite history backfill (async, InvocationType=Event)
        - PolicyName: InvokeDailyBatchForBackfill
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-daily-batch-${Environment}'

  # S3 Bucket for satellite data & previews
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-data-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Field Onboarding Lambda (placeholder - will be updated with container image)
  FieldOnboardingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-field-onboarding-${Environment}'
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          from datetime import datetime
          
          dynamodb = boto3.resource('dynamodb')
          fields_table = dynamodb.Table(os.environ['FIELDS_TABLE'])
          
          def handler(event, context):
              """Field onboarding handler"""
              body = json.loads(event.get('body', '{}'))
              
              field_id = str(uuid.uuid4())
              user_id = event.get('requestContext', {}).get('authorizer', {}).get('claims', {}).get('sub', 'unknown')
              
              field_data = {
                  'fieldId': field_id,
                  'userId': user_id,
                  'geometry': body.get('geometry'),
                  'plantingDate': body.get('plantingDate'),
                  'hybridRM': body.get('hybridRM'),
                  'targetGDD': body.get('targetGDD'),
                  'irrigationType': body.get('irrigationType'),
                  'soilTest': body.get('soilTest', {}),
                  'createdAt': datetime.utcnow().isoformat(),
                  'status': 'active'
              }
              
              try:
                  fields_table.put_item(Item=field_data)
                  return {
                      'statusCode': 201,
                      'body': json.dumps({'fieldId': field_id, 'message': 'Field created successfully'})
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
      Environment:
        Variables:
          FIELDS_TABLE: !Ref FieldsTableName
          OBSERVATIONS_TABLE: !Ref ObservationsTableName
          DAILY_STATUS_TABLE: !Ref DailyStatusTableName
          DATA_BUCKET: !Ref DataBucket
          DAILY_BATCH_FUNCTION: !Sub '${ProjectName}-daily-batch-${Environment}'

  # Daily Batch Lambda (container image)
  DailyBatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-daily-batch-${Environment}'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900  # 15 minutes for batch processing
      MemorySize: 1024
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/harvestai-lambdas:latest'
      Environment:
        Variables:
          FIELDS_TABLE:        !Ref FieldsTableName
          OBSERVATIONS_TABLE:  !Ref ObservationsTableName
          DAILY_STATUS_TABLE:  !Ref DailyStatusTableName
          WEATHER_TABLE:       !Ref WeatherHistoryTableName
          ET_TABLE:            !Ref ETHistoryTableName
          BATCH_LOG_TABLE:     !Ref BatchLogTableName
          DATA_BUCKET:         !Ref DataBucket
          SECRETS_ARN:         !Ref APIKeySecretsArn
          BEDROCK_REGION:      !Ref AWS::Region

  # Get Field Status Lambda
  GetFieldStatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-get-field-status-${Environment}'
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          dynamodb = boto3.resource('dynamodb')
          daily_status_table = dynamodb.Table(os.environ['DAILY_STATUS_TABLE'])
          
          def handler(event, context):
              """Get latest daily status for a field"""
              field_id = event.get('pathParameters', {}).get('fieldId')
              
              if not field_id:
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'fieldId required'})
                  }
              
              try:
                  response = daily_status_table.query(
                      KeyConditionExpression='fieldId = :fid',
                      ExpressionAttributeValues={':fid': field_id},
                      ScanIndexForward=False,
                      Limit=1
                  )
                  
                  if response.get('Items'):
                      return {
                          'statusCode': 200,
                          'body': json.dumps(response['Items'][0])
                      }
                  else:
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': 'No status found'})
                      }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
      Environment:
        Variables:
          DAILY_STATUS_TABLE: !Ref DailyStatusTableName

Outputs:
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Description: Lambda execution role ARN

  FieldOnboardingLambdaArn:
    Value: !GetAtt FieldOnboardingFunction.Arn
    Description: Field onboarding Lambda ARN

  FieldOnboardingLambdaName:
    Value: !Ref FieldOnboardingFunction
    Description: Field onboarding Lambda function name

  DailyBatchLambdaArn:
    Value: !GetAtt DailyBatchFunction.Arn
    Description: Daily batch Lambda ARN

  DailyBatchLambdaName:
    Value: !Ref DailyBatchFunction
    Description: Daily batch Lambda function name

  GetFieldStatusLambdaArn:
    Value: !GetAtt GetFieldStatusFunction.Arn
    Description: Get field status Lambda ARN

  DataBucketName:
    Value: !Ref DataBucket
    Description: Data bucket name

  StackName:
    Value: !Ref AWS::StackName
    Description: Stack name
